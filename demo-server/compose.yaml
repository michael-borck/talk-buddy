services:
  demo-proxy:
    build: .
    image: talkbuddy-demo-proxy
    restart: unless-stopped
    # Bound to all interfaces so containerised Caddy can reach it via
    # host.docker.internal (host-gateway); loopback-only would refuse.
    # Caddy on the same host is the public front door.
    ports:
      - "8787:8787"
    env_file: .env
